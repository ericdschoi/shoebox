name: Probe toolchain
on:
  push:
    branches: [duo-two-pane]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Xcode versions
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
      - name: Simulators
        run: |
          xcrun simctl list devicetypes | grep -iE "duo|iPhone 1[78]|iPhone Air" || true
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -iE "duo" || true
      - name: SwiftUI API
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          F=$(find "$SDK/System/Library/Frameworks/SwiftUI.framework" "$SDK/System/Library/Frameworks/SwiftUICore.framework" -name "arm64*simulator*.swiftinterface" | grep -v private)
          echo "$F"
          for pat in "defaultTabBarPlacement" "isTabViewSidebarAvailable" "struct ArrangementView" "arrangementViewStyle" "splitArrangementLayoutRatio" "sidebarAdaptable" "TabBarPlacement" "preferredCompactColumn" "onHingeChange"; do
            echo "=== $pat"
            grep -n -B3 -A3 "$pat" $F | head -60 || true
          done
