name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Core tests
        run: |
          set -o pipefail
          cd Packages/ShoeboxCore
          swift test 2>&1 | tee ../../core-tests.log | grep -E "error|failed|Executed" || true
          grep -q "with 0 failures" ../../core-tests.log
      - name: Generate project
        run: xcodegen generate
      - name: Build (iOS Simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Shoebox.xcodeproj -scheme Shoebox \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|BUILD|\*\* " || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -150 || true
          tail -40 build.log || true
      - name: Warnings
        if: always()
        run: grep -E "warning:" build.log | grep -v "Packages/" | sort -u | head -80 > warnings.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            warnings.txt
            core-tests.log
      - name: Screenshots (demo data)
        if: success()
        continue-on-error: true
        run: |
          set -x
          APP=build/Build/Products/Debug-iphonesimulator/Shoebox.app
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          keys=sorted([k for k in d if 'iOS' in k], key=lambda k:[int(x) for x in k.split('iOS-')[-1].split('-')])
          phones=[x for x in d[keys[-1]] if x['name'].startswith('iPhone')]
          pick=[x for x in phones if x['name'].endswith(' Pro')] or phones
          print(pick[-1]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" com.ericdschoi.shoebox >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" com.ericdschoi.shoebox -demo "$@"
            sleep 5
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          xcrun simctl ui "$UDID" appearance light
          shot 01-summary -tab 0
          shot 02-expenses -tab 1
          shot 03-expense -screen expense
          shot 04-add -screen add
          shot 05-withdrawals -tab 2
          shot 06-withdraw -screen withdraw
          shot 07-withdrawal -screen withdrawal
          shot 08-settings -tab 3
          shot 09-onboarding -onboarding -empty
          shot 10-empty -empty
          shot 15-expense-missing -screen expense -pick missing
          shot 16-expense-partial -screen expense -pick partial
          shot 17-withdraw-filled -screen withdraw -amount 1000
          shot 18-integrity -screen integrity
          shot 19-backup -screen backup
          shot 20-withdrawals-empty -empty -tab 2
          xcrun simctl ui "$UDID" appearance dark
          shot 11-summary-dark -tab 0
          shot 12-expense-dark -screen expense
          shot 13-add-dark -screen add
          shot 14-withdrawals-dark -tab 2
          # Exercise exports, text recognition, integrity and mirroring inside the simulator.
          xcrun simctl terminate "$UDID" com.ericdschoi.shoebox >/dev/null 2>&1 || true
          xcrun simctl launch "$UDID" com.ericdschoi.shoebox -demo -selftest
          sleep 15
          DATA=$(xcrun simctl get_app_container "$UDID" com.ericdschoi.shoebox data)
          cp -R "$DATA/Library/Caches/SelfTest" shots/selftest || true
          cat shots/selftest/result.txt || true
          # Smaller copies keep the artifact quick to download and review.
          mkdir -p shots/small
          for f in shots/*.png; do sips -Z 1100 "$f" --out "shots/small/$(basename "$f")" >/dev/null; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: xcodeproj
          path: |
            Shoebox.xcodeproj
            Config
